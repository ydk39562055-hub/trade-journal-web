// 사진 압축: 최대 1280px, jpeg 0.7 → dataURL
function compressImage(file){
  return new Promise(res=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1280; let{width:w,height:h}=img;
      if(w>max||h>max){ if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;} }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.7));
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}

async function loadPrinciples(){
  principles = localStorage.getItem(LS_PRIN) || DEFAULT_PRINCIPLES;
  try{
    const { data } = await sb.from('journal_prefs').select('principles').eq('user_id', session.user.id).maybeSingle();
    if(data && data.principles){
      principles = data.principles;
    }else{                          // 처음이면 기본 원칙을 클라우드에 심어둠
      principles = DEFAULT_PRINCIPLES;
      await sb.from('journal_prefs').upsert({ user_id: session.user.id, principles });
    }
    localStorage.setItem(LS_PRIN, principles);
  }catch(e){ /* 오프라인: 캐시/기본값 사용 */ }
}

async function savePrinciples(text){
  principles = text;
  localStorage.setItem(LS_PRIN, text);
  try{
    await sb.from('journal_prefs').upsert({ user_id: session.user.id, principles: text, updated_at: new Date().toISOString() });

  }catch(e){ flashSaved('⚠ 원칙 클라우드 저장 실패(로컬엔 있음)'); }
}

async function fetchEntries(){
  loadPrinciples();                // 원칙도 같이 로드(백그라운드)
  entries = loadCache();           // 즉시 캐시 표시
  render();
  try{
    const { data, error } = await sb.from('free_journal').select('*').order('traded_at',{ascending:false}).order('created_at',{ascending:false});
    if(error) throw error;
    entries = data || [];
    saveCache(); render();
  }catch(e){ console.warn('클라우드 로드 실패, 캐시 사용', e); }
}

async function upsertEntry(entry){
  // 즉시 로컬 반영
  const i = entries.findIndex(x=>x.id===entry.id);
  if(i>=0) entries[i]=entry; else entries.unshift(entry);
  entries.sort((a,b)=> (b.traded_at||'').localeCompare(a.traded_at||'') || (b.created_at||'').localeCompare(a.created_at||''));
  saveCache(); render();
  // 클라우드 저장
  const row={ id:entry.id, user_id:session.user.id, market:entry.market, traded_at:entry.traded_at, body:entry.body, photos:entry.photos,
    direction:entry.direction??null, entry_price:entry.entry_price??null, exit_price:entry.exit_price??null,
    result:entry.result??null, realized_r:entry.realized_r??null, pnl:entry.pnl??null, errors:entry.errors||[], updated_at:new Date().toISOString() };
  const { error } = await sb.from('free_journal').upsert(row);
  if(error){ flashSaved('⚠ 클라우드 저장 실패(로컬엔 있음)'); document.getElementById('saveDot').style.color='var(--futures)'; }
  else flashSaved();
}

async function removeEntry(id){
  entries = entries.filter(x=>x.id!==id); saveCache(); render();
  const { error } = await sb.from('free_journal').delete().eq('id',id);
  flashSaved(error?'⚠ 삭제 클라우드 반영 실패':'삭제됨');
}

function sparkline(values, w=320, h=90){
  if(!values || values.length<2) return '';
  const min=Math.min(...values,0), max=Math.max(...values,0);
  const range=(max-min)||1;
  const pts=values.map((v,i)=>{ const x=i/(values.length-1)*w; const y=h-((v-min)/range)*(h-6)-3; return x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  const zeroY=h-((0-min)/range)*(h-6)-3;
  const last=values[values.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="margin-top:6px;background:#fff;border:1px solid var(--border);border-radius:8px">
    <line x1="0" y1="${zeroY.toFixed(1)}" x2="${w}" y2="${zeroY.toFixed(1)}" stroke="#d4d2cb" stroke-width="1" stroke-dasharray="3"/>
    <polyline points="${pts}" fill="none" stroke="${last>=0?'var(--futures)':'var(--spot)'}" stroke-width="2"/>
  </svg>`;
}

function openDashboard(){
  const fnum=n=>(n===Infinity?'∞':Math.round(n*100)/100);
  const money=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR');
  const num=v=> (v!=null&&v!=='' && !isNaN(Number(v))) ? Number(v) : null;

  const closed=entries.filter(e=>['win','loss','be'].includes(e.result));
  const wins=closed.filter(e=>e.result==='win').length;
  const losses=closed.filter(e=>e.result==='loss').length;
  const bes=closed.filter(e=>e.result==='be').length;
  const decisive=wins+losses;
  const winRate=decisive?wins/decisive*100:0;

  const rs=entries.map(e=>num(e.realized_r)).filter(v=>v!=null);
  const sumR=rs.reduce((a,b)=>a+b,0), avgR=rs.length?sumR/rs.length:0;
  const posR=rs.filter(r=>r>0).reduce((a,b)=>a+b,0), negR=Math.abs(rs.filter(r=>r<0).reduce((a,b)=>a+b,0));
  const pf=negR?posR/negR:(posR>0?Infinity:0);

  const pls=entries.map(e=>num(e.pnl)).filter(v=>v!=null);
  const sumP=pls.reduce((a,b)=>a+b,0), avgP=pls.length?sumP/pls.length:0;
  const best=pls.length?Math.max(...pls):0, worst=pls.length?Math.min(...pls):0;
  const winP=pls.filter(v=>v>0), lossP=pls.filter(v=>v<0);
  const avgWin=winP.length?winP.reduce((a,b)=>a+b,0)/winP.length:0;
  const avgLoss=lossP.length?Math.abs(lossP.reduce((a,b)=>a+b,0)/lossP.length):0;
  const payoff=avgLoss?avgWin/avgLoss:(avgWin>0?Infinity:0);

  // 시간순(오래된→최근)
  const chrono=[...entries].sort((a,b)=>(a.traded_at||'').localeCompare(b.traded_at||'')||(a.created_at||'').localeCompare(b.created_at||''));

  // 누적 곡선 — pnl 있으면 금액, 없으면 R
  const useMoney=pls.length>0;
  const seq=chrono.map(e=> useMoney?num(e.pnl):num(e.realized_r)).filter(v=>v!=null);
  let cum=0; const curve=seq.map(v=>(cum+=v));
  let peak=-Infinity, mdd=0;
  for(const v of curve){ if(v>peak)peak=v; const dd=peak-v; if(dd>mdd)mdd=dd; }

  // 연승/연패
  const closedChrono=chrono.filter(e=>['win','loss'].includes(e.result));
  let maxW=0,maxL=0,cw=0,cl=0;
  for(const e of closedChrono){ if(e.result==='win'){cw++;cl=0;}else{cl++;cw=0;} if(cw>maxW)maxW=cw; if(cl>maxL)maxL=cl; }

  // 방향별
  const dirStat=d=>{ const c=entries.filter(e=>e.direction===d); const cd=c.filter(e=>['win','loss'].includes(e.result)); const w=cd.filter(e=>e.result==='win').length; const p=c.map(e=>num(e.pnl)).filter(v=>v!=null).reduce((a,b)=>a+b,0); return {n:c.length, wr:cd.length?Math.round(w/cd.length*100):null, p}; };
  const L=dirStat('long'), S=dirStat('short');

  // 월별 손익
  const byMonth={};
  for(const e of entries){ const m=(e.traded_at||'').slice(0,7); const v=num(e.pnl); if(!m||v==null)continue; byMonth[m]=(byMonth[m]||0)+v; }
  const monthRows=Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,v])=>`<tr><td>${m}</td><td style="color:${v>=0?'var(--futures)':'var(--spot)'}">${v>=0?'+':''}${money(v)}</td></tr>`).join('');

  // 실수 태그별 (건수·승률·손익)
  const tagStats={};
  for(const e of entries) for(const t of (e.errors||[])){ const s=tagStats[t]=tagStats[t]||{n:0,w:0,l:0,p:0}; s.n++; if(e.result==='win')s.w++; if(e.result==='loss')s.l++; const pv=num(e.pnl); if(pv!=null)s.p+=pv; }
  const tagRows=Object.entries(tagStats).sort((a,b)=>b[1].n-a[1].n).map(([t,s])=>{ const d=s.w+s.l; const wr=d?Math.round(s.w/d*100)+'%':'-'; return `<tr><td>${esc(t)}</td><td>${s.n}</td><td>${wr}</td><td style="color:${s.p>=0?'var(--futures)':'var(--spot)'}">${s.p>=0?'+':''}${money(s.p)}</td></tr>`; }).join('');

  // 규칙 준수율 (마감 거래 중 실수태그 0)
  const clean=closed.filter(e=>!(e.errors&&e.errors.length)).length;
  const adher=closed.length?Math.round(clean/closed.length*100):null;

  const hasAny=closed.length||rs.length||pls.length;
  const dlg=document.createElement('dialog');
  dlg.innerHTML=`<div class="modal-in">
    <div class="modal-head"><h2>📊 통계</h2><button class="x" id="close">×</button></div>
    ${hasAny?`
      <div class="stat-row"><span>마감 거래</span><span class="v">${closed.length}건 (익${wins}·손${losses}·본${bes})</span></div>
      <div class="stat-row"><span>승률 (익/[익+손])</span><span class="v">${Math.round(winRate)}%</span></div>
      ${pls.length?`
      <div class="stat-row"><span>총 손익금액</span><span class="v" style="color:${sumP>=0?'var(--futures)':'var(--spot)'}">${sumP>=0?'+':''}${money(sumP)}</span></div>
      <div class="stat-row"><span>평균 손익 / 거래</span><span class="v">${avgP>=0?'+':''}${money(avgP)}</span></div>
      <div class="stat-row"><span>최고익절 / 최대손실</span><span class="v" style="font-size:13px">+${money(best)} / ${money(worst)}</span></div>
      <div class="stat-row"><span>평균익절 / 평균손절 (payoff)</span><span class="v" style="font-size:13px">+${money(avgWin)} / −${money(avgLoss)} = ${fnum(payoff)}</span></div>
      `:''}
      <div class="stat-row"><span>누적 R · 평균 R</span><span class="v">${sumR>0?'+':''}${fnum(sumR)}R · ${avgR>0?'+':''}${fnum(avgR)}R</span></div>
      <div class="stat-row"><span>손익비 (Profit Factor)</span><span class="v">${fnum(pf)}</span></div>
      <div class="stat-row"><span>최대 연승 / 연패</span><span class="v">${maxW} / ${maxL}</span></div>
      <div class="stat-row"><span>최대 낙폭 (MDD)</span><span class="v">${useMoney?money(mdd):fnum(mdd)+'R'}</span></div>
      ${adher!=null?`<div class="stat-row"><span>규칙 준수율 (실수 0건)</span><span class="v">${adher}%</span></div>`:''}

      ${curve.length>1?`<h3 style="margin:16px 0 4px;font-size:15px">누적 손익 곡선 (${useMoney?'금액':'R'})</h3>${sparkline(curve)}`:''}

      <h3 style="margin:16px 0 0;font-size:15px">방향별</h3>
      <div class="stat-row"><span>롱</span><span class="v" style="font-size:13px">${L.n}건 · 승률 ${L.wr==null?'-':L.wr+'%'} · ${L.p>=0?'+':''}${money(L.p)}</span></div>
      <div class="stat-row"><span>숏</span><span class="v" style="font-size:13px">${S.n}건 · 승률 ${S.wr==null?'-':S.wr+'%'} · ${S.p>=0?'+':''}${money(S.p)}</span></div>

      ${monthRows?`<h3 style="margin:16px 0 0;font-size:15px">월별 손익</h3><table class="xt"><tr><th>월</th><th>손익</th></tr>${monthRows}</table>`:''}

      ${tagRows?`<h3 style="margin:16px 0 0;font-size:15px">실수 태그별 (약점 + 손익)</h3><table class="xt"><tr><th>태그</th><th>건수</th><th>승률</th><th>손익</th></tr>${tagRows}</table>`:''}
    `:`<div class="muted">아직 결과/손익/R을 입력한 거래가 없어요.<br>일지 작성 시 📊 상세에서 채우면 여기 통계가 잡힙니다.</div>`}
  </div>`;
  document.body.appendChild(dlg); dlg.showModal();
  dlg.querySelector('#close').onclick=()=>dlg.close();
  dlg.addEventListener('close',()=>dlg.remove());
}

function exportCSV(){
  const cols=['traded_at','market','direction','entry_price','exit_price','result','realized_r','pnl','errors','body'];
  const cell=(e,c)=>{ let v=c==='errors'? (e.errors||[]).join('|') : (e[c]??''); if(typeof v==='number'&&!Number.isFinite(v))v=''; v=String(v).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v; };
  const csv='﻿'+[cols.join(','), ...entries.map(e=>cols.map(c=>cell(e,c)).join(','))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`거래일지_${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  flashSaved('CSV 내보냄 ✓');
}

// ───────── 매매 원칙 ─────────
function openPrinciples(){
  let editing=false;
  const dlg=document.createElement('dialog');
  const draw=()=>{
    dlg.innerHTML=`<div class="modal-in">
      <div class="modal-head">
        <h2>📜 매매 원칙</h2>
        <button class="btn-ghost btn-sm" id="edit">${editing?'보기':'편집'}</button>
        <button class="x" id="close">×</button>
      </div>
      ${editing
        ? `<textarea id="pbody" style="min-height:55vh;font-size:14px">${esc(principles)}</textarea>
           <div class="row" style="margin-top:10px;gap:8px">
             <button class="btn-ghost" id="pdefault" style="flex:1">기본(ICT) 불러오기</button>
             <button class="btn" id="psave" style="flex:1">저장</button>
           </div>
           <div class="hint">원칙은 자유롭게 고치세요. 클라우드에 저장돼 어느 기기서나 보입니다.</div>`
        : `<div class="body" style="font-size:15px;line-height:1.7">${esc(principles)}</div>`}
    </div>`;
    dlg.querySelector('#close').onclick=()=>dlg.close();
    dlg.querySelector('#edit').onclick=()=>{ editing=!editing; draw(); };
    if(editing){
      dlg.querySelector('#pdefault').onclick=()=>{ dlg.querySelector('#pbody').value=DEFAULT_PRINCIPLES; };
      dlg.querySelector('#psave').onclick=async()=>{
        await savePrinciples(dlg.querySelector('#pbody').value);
        editing=false; draw();
      };
    }
  };
  document.body.appendChild(dlg); draw(); dlg.showModal();
  dlg.addEventListener('close',()=>dlg.remove());
}

// ───────── 로그인 ─────────
function renderLogin(){
  app.innerHTML=`<div class="center"><div class="login">
    <h1>거래일지</h1>
    <p class="hint">이메일로 6자리 코드를 받아 로그인합니다.<br>한 번 로그인하면 어느 기기서나 같은 일지가 보여요.</p>
    <div id="step1">
      <label style="text-align:left">이메일</label>
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
      <button class="btn" id="send" style="width:100%;margin-top:10px">코드 받기</button>
    </div>
    <div id="step2" style="display:none">
      <label style="text-align:left">메일로 온 6자리 코드</label>
      <input type="text" id="code" inputmode="numeric" placeholder="123456" autocomplete="one-time-code">
      <button class="btn" id="verify" style="width:100%;margin-top:10px">로그인</button>
    </div>
    <div class="err" id="lerr"></div>
  </div></div>`;
  const err=t=>document.getElementById('lerr').textContent=t||'';
  document.getElementById('send').onclick=async()=>{
    const email=document.getElementById('email').value.trim(); if(!email){err('이메일을 입력하세요');return;}
    err('보내는 중...');
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error){ err('전송 실패: '+error.message); return; }
    window._email=email; document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block'; err('');
  };
  document.getElementById('verify').onclick=async()=>{
    const token=document.getElementById('code').value.trim();
    err('확인 중...');
    const { data, error } = await sb.auth.verifyOtp({ email:window._email, token, type:'email' });
    if(error){ err('코드가 틀렸어요: '+error.message); return; }
    session=data.session; fetchEntries();
  };
}

// ───────── 시작 ─────────
const { data:{ session:s } } = await sb.auth.getSession();
session = s;
if(session) fetchEntries(); else renderLogin();
sb.auth.onAuthStateChange((_e, ns)=>{ session=ns; });
</script>
