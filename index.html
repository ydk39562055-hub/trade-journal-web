<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 고친 화면이 안 뜨던 원인(2026-08-09): 스크립트는 ?v= 로 새로 받는데 index.html 자체가
     캐시에 남아 옛 파일 목록을 계속 썼다. 설치형 앱(PWA)에서 특히 오래 남았다. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>거래일지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236655e0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M3 17l5-5 4 4 8-9'/><path d='M21 7v5'/><path d='M16 7h5'/></svg>">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app/theme.css?v=20260809c">

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#6655e0"/>
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 64l12-12 9 9 22-24"/><path d="M76 37v12"/><path d="M64 37h12"/>
    </g>
  </svg>
</template>

<!-- 자동 최신화 로더: 매 로드마다 ?v=타임스탬프로 받아 항상 최신 버전을 띄움(캐시 무력화) -->
<script>
(async function () {
  const bust = '?v=' + Date.now();
  const plain = ['app/data.js', 'app/stats.js', 'app/sync.js', 'app/portfolio.js'];
  const babel = ['app/charts.jsx', 'app/components.jsx', 'app/assets-panel.jsx', 'app/networth-card.jsx', 'app/modals.jsx', 'app/restore-modal.jsx', 'app/dashboard.jsx', 'app/hero.jsx', 'app/main.jsx'];
  const fail = (m) => { document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#9a5a34;font-family:sans-serif">로딩 실패 — 인터넷 확인 후 새로고침<br><small>' + m + '</small></div>'; };
  try {
    for (const src of plain) {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = src + bust; s.onload = res; s.onerror = () => rej(new Error(src)); document.body.appendChild(s); });
    }
    for (const src of babel) {
      const code = await fetch(src + bust).then(r => { if (!r.ok) throw new Error(src + ' ' + r.status); return r.text(); });
      const out = Babel.transform(code, { presets: ['react'], filename: src }).code;
      const s = document.createElement('script'); s.textContent = out; document.body.appendChild(s);
    }
  } catch (e) { fail(e.message); }
})();
</script>
</body>
</html>
