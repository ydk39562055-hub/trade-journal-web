<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>거래일지</title>
<style>
  :root{
    --bg:#ecebe6; --card:#f5f4ef; --ink:#1f1d1a; --ink2:#4a4742; --ink3:#807c75;
    --border:#d4d2cb; --accent:#c47a3d; --accentSoft:#efe1d2;
    --futures:#c4513a; --spot:#3d6b8a; --ok:#3f7d54;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    font-size:16px;line-height:1.5;padding-bottom:80px}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);
    padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10}
  header h1{font-size:18px;margin:0;flex:1}
  .save-dot{font-size:12px;color:var(--ink3)}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px}
  .btn{background:var(--accent);color:#fff;font-weight:600}
  .btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--border)}
  .btn-sm{padding:6px 10px;font-size:14px;border-radius:8px}
  input,textarea,select{font:inherit;width:100%;border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical}
  label{font-size:13px;color:var(--ink3);display:block;margin:10px 0 4px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
  .row{display:flex;gap:8px;align-items:center}
  .tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
  .tag.futures{background:var(--futures)} .tag.spot{background:var(--spot)}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{flex:1;background:#fff;color:var(--ink2);border-radius:0;font-weight:600}
  .seg button.on.futures{background:var(--futures);color:#fff}
  .seg button.on.spot{background:var(--spot);color:#fff}
  .filterbar{display:flex;gap:6px;margin:12px 0}
  .filterbar button{flex:1}
  .filterbar button.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
  .body{white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
  .meta{font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
  .muted{color:var(--ink3);font-size:14px;text-align:center;padding:30px}
  .fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:20}
  dialog{border:none;border-radius:16px;padding:0;max-width:680px;width:92%;background:var(--card)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .modal-in{padding:16px}
  .modal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .modal-head h2{font-size:17px;margin:0;flex:1}
  .x{background:none;color:var(--ink3);font-size:22px;padding:4px 8px}
  .thumb-big{max-width:100%;border-radius:10px;margin-top:8px}
  .center{min-height:70vh;display:flex;align-items:center;justify-content:center}
  .login{max-width:340px;width:100%;text-align:center}
  .login h1{font-size:22px}
  .hint{font-size:13px;color:var(--ink3);margin-top:10px}
  .err{color:var(--futures);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://oxogtsfxdjbctzehxvae.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3vXShFC5dKvMqzUy1KkyGQ_sF0SzUY2'; // 공개용(publishable) 키 — RLS로 보호
const LS_KEY = 'free_journal_cache_v1';
const LS_PRIN = 'free_journal_principles_v1';
let principles = '';
const DEFAULT_PRINCIPLES = `📌 선물 매매 원칙  (시작 세트 — 본인에 맞게 수정하세요)

[리스크 — 제일 중요]
1. 1회 손실 한도 = 계좌의 1% (배우는 중엔 0.5%). 손실액 기준으로 수량을 정한다 — 레버리지로 키우지 않는다.
2. 손절 없이 진입 금지. 선물은 청산(강제매도) 위험 → 손절가를 먼저 정하고 들어간다.
3. 손익비(R:R) 1.5 이상일 때만 진입. 먹을 게 잃을 것의 1.5배 미만이면 패스.
4. 레버리지는 '증거금 효율' 도구지 '크기 키우는' 도구가 아니다. 1% 손실 한도가 수량을 정한다.

[규율 — 감정 제어]
5. 하루 손실 -2R(2~3연패) 도달 → 그날 매매 끝. 복구하려 더 들어가지 않는다.
6. 복수 매매 금지 — 손실 직후 바로 재진입하지 않는다 (최소 15분 쉬기).
7. 손절 밀지 않기 — 한 번 정한 손절을 불리한 쪽으로 옮기지 않는다.
8. 물타기 금지 — 지고 있는 포지션에 추가 진입하지 않는다.
9. 추격 금지 — 떠난 자리 쫓지 않고 다음 셋업을 기다린다.

[환경 — 진입 조건]
10. 주요 지표(CPI·FOMC·고용) 발표 전후 30분 진입 금지. 변동성 폭발 구간.
11. 명확한 근거/셋업 없으면 안 한다. '느낌'으로 들어가지 않는다.
12. 상위 시간대(추세) 방향과 맞을 때 우선. 역행 진입은 크기를 줄인다.

[복기 — 성장]
13. 이긴 매매도 기록한다 — 실력인지 운인지 구분하려고.
14. 과정 > 결과. 규칙 지키고 졌으면 좋은 매매, 규칙 어기고 이겼으면 나쁜 매매.`;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

const app = document.getElementById('app');
let session = null;
let entries = [];

// ───────── 유틸 ─────────
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function saveCache(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }catch{} }
function loadCache(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch{ return []; } }

// 사진 압축: 최대 1280px, jpeg 0.7 → dataURL
function compressImage(file){
  return new Promise(res=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1280; let{width:w,height:h}=img;
      if(w>max||h>max){ if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;} }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.7));
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}

let saveTimer=null;
function flashSaved(txt='저장됨 ✓'){
  const el=document.getElementById('saveDot'); if(!el)return;
  el.textContent=txt; el.style.color='var(--ok)';
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ el.textContent=''; },2500);
}

// ───────── 데이터 ─────────
async function loadPrinciples(){
  principles = localStorage.getItem(LS_PRIN) || DEFAULT_PRINCIPLES;
  try{
    const { data } = await sb.from('journal_prefs').select('principles').eq('user_id', session.user.id).maybeSingle();
    if(data && data.principles){
      principles = data.principles;
    }else{                          // 처음이면 기본 원칙을 클라우드에 심어둠
      principles = DEFAULT_PRINCIPLES;
      await sb.from('journal_prefs').upsert({ user_id: session.user.id, principles });
    }
    localStorage.setItem(LS_PRIN, principles);
  }catch(e){ /* 오프라인: 캐시/기본값 사용 */ }
}

async function savePrinciples(text){
  principles = text;
  localStorage.setItem(LS_PRIN, text);
  try{
    await sb.from('journal_prefs').upsert({ user_id: session.user.id, principles: text, updated_at: new Date().toISOString() });
    flashSaved('원칙 저장됨 ✓');
  }catch(e){ flashSaved('⚠ 원칙 클라우드 저장 실패(로컬엔 있음)'); }
}

async function fetchEntries(){
  loadPrinciples();                // 원칙도 같이 로드(백그라운드)
  entries = loadCache();           // 즉시 캐시 표시
  render();
  try{
    const { data, error } = await sb.from('free_journal').select('*').order('traded_at',{ascending:false}).order('created_at',{ascending:false});
    if(error) throw error;
    entries = data || [];
    saveCache(); render();
  }catch(e){ console.warn('클라우드 로드 실패, 캐시 사용', e); }
}

async function upsertEntry(entry){
  // 즉시 로컬 반영
  const i = entries.findIndex(x=>x.id===entry.id);
  if(i>=0) entries[i]=entry; else entries.unshift(entry);
  entries.sort((a,b)=> (b.traded_at||'').localeCompare(a.traded_at||'') || (b.created_at||'').localeCompare(a.created_at||''));
  saveCache(); render();
  // 클라우드 저장
  const row={ id:entry.id, user_id:session.user.id, market:entry.market, traded_at:entry.traded_at, body:entry.body, photos:entry.photos, updated_at:new Date().toISOString() };
  const { error } = await sb.from('free_journal').upsert(row);
  if(error){ flashSaved('⚠ 클라우드 저장 실패(로컬엔 있음)'); document.getElementById('saveDot').style.color='var(--futures)'; }
  else flashSaved();
}

async function removeEntry(id){
  entries = entries.filter(x=>x.id!==id); saveCache(); render();
  const { error } = await sb.from('free_journal').delete().eq('id',id);
  flashSaved(error?'⚠ 삭제 클라우드 반영 실패':'삭제됨');
}

// ───────── 화면 ─────────
let filter='all';

function render(){
  if(!session){ renderLogin(); return; }
  const list = entries.filter(e=> filter==='all' || e.market===filter);
  app.innerHTML = `
    <header>
      <h1>거래일지</h1>
      <span class="save-dot" id="saveDot"></span>
      <button class="btn-ghost btn-sm" id="principles">📜 원칙</button>
      <button class="btn-ghost btn-sm" id="logout">로그아웃</button>
    </header>
    <div class="wrap">
      <div class="filterbar">
        ${['all','선물','현물'].map(f=>`<button data-f="${f}" class="btn-ghost ${filter===f?'on':''}">${f==='all'?'전체':f}</button>`).join('')}
      </div>
      ${list.length? list.map(cardHtml).join('') : `<div class="muted">아직 일지가 없어요.<br>오른쪽 아래 + 로 첫 기록을 남겨보세요.</div>`}
    </div>
    <button class="fab" id="add">+</button>`;
  document.getElementById('add').onclick=()=>openEditor();
  document.getElementById('principles').onclick=()=>openPrinciples();
  document.getElementById('logout').onclick=async()=>{ await sb.auth.signOut(); session=null; render(); };
  app.querySelectorAll('[data-f]').forEach(b=> b.onclick=()=>{ filter=b.dataset.f; render(); });
  app.querySelectorAll('[data-edit]').forEach(b=> b.onclick=()=> openEditor(b.dataset.edit));
  app.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{ if(confirm('이 일지를 삭제할까요?')) removeEntry(b.dataset.del); });
}

function cardHtml(e){
  const cls = e.market==='선물'?'futures':'spot';
  const photos = (e.photos||[]).map(p=>`<img src="${p}" loading="lazy">`).join('');
  return `<div class="card">
    <div class="row">
      <span class="tag ${cls}">${e.market}</span>
      <span class="meta" style="flex:1">${esc(e.traded_at||'')}</span>
      <button class="btn-ghost btn-sm" data-edit="${e.id}">수정</button>
      <button class="btn-ghost btn-sm" data-del="${e.id}">삭제</button>
    </div>
    ${e.body?`<div class="body">${esc(e.body)}</div>`:''}
    ${photos?`<div class="photos">${photos}</div>`:''}
  </div>`;
}

function openEditor(id){
  const e = id? entries.find(x=>x.id===id) : { id:crypto.randomUUID(), market:'선물', traded_at:todayStr(), body:'', photos:[], created_at:new Date().toISOString() };
  const draft = JSON.parse(JSON.stringify(e));
  const dlg=document.createElement('dialog');
  dlg.innerHTML=`<div class="modal-in">
    <div class="modal-head">
      <h2>${id?'일지 수정':'새 일지'}</h2>
      <button class="x" id="close">×</button>
    </div>
    <div class="seg" id="seg">
      <button data-m="선물" class="futures ${draft.market==='선물'?'on':''}">선물</button>
      <button data-m="현물" class="spot ${draft.market==='현물'?'on':''}">현물</button>
    </div>
    <label>날짜</label>
    <input type="date" id="date" value="${draft.traded_at}">
    <label>메모 (자유롭게)</label>
    <textarea id="body" placeholder="진입 이유, 느낀 점, 실수, 뭐든 자유롭게...">${esc(draft.body)}</textarea>
    <label>사진/차트 (여러 장 가능)</label>
    <input type="file" id="files" accept="image/*" multiple>
    <div class="photos" id="thumbs"></div>
    <div class="row" style="margin-top:16px;gap:8px">
      <button class="btn" id="save" style="flex:1">저장</button>
    </div>
    <div class="hint" id="msg"></div>
  </div>`;
  document.body.appendChild(dlg); dlg.showModal();
  const drawThumbs=()=>{ dlg.querySelector('#thumbs').innerHTML=(draft.photos||[]).map((p,idx)=>`<div style="position:relative"><img src="${p}"><button class="x" data-rm="${idx}" style="position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--border);border-radius:50%;width:22px;height:22px;padding:0;line-height:1">×</button></div>`).join('');
    dlg.querySelectorAll('[data-rm]').forEach(b=> b.onclick=()=>{ draft.photos.splice(+b.dataset.rm,1); drawThumbs(); }); };
  drawThumbs();
  dlg.querySelectorAll('#seg button').forEach(b=> b.onclick=()=>{ draft.market=b.dataset.m; dlg.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  dlg.querySelector('#date').onchange=ev=> draft.traded_at=ev.target.value;
  dlg.querySelector('#body').oninput=ev=> draft.body=ev.target.value;
  dlg.querySelector('#files').onchange=async ev=>{
    const msg=dlg.querySelector('#msg'); msg.textContent='사진 처리 중...';
    for(const f of ev.target.files){ const d=await compressImage(f); if(d) draft.photos.push(d); }
    msg.textContent=''; drawThumbs(); ev.target.value='';
  };
  dlg.querySelector('#close').onclick=()=> dlg.close();
  dlg.querySelector('#save').onclick=async()=>{
    draft.body=dlg.querySelector('#body').value;
    await upsertEntry(draft); dlg.close();
  };
  dlg.addEventListener('close',()=> dlg.remove());
}

// ───────── 매매 원칙 ─────────
function openPrinciples(){
  let editing=false;
  const dlg=document.createElement('dialog');
  const draw=()=>{
    dlg.innerHTML=`<div class="modal-in">
      <div class="modal-head">
        <h2>📜 매매 원칙</h2>
        <button class="btn-ghost btn-sm" id="edit">${editing?'보기':'편집'}</button>
        <button class="x" id="close">×</button>
      </div>
      ${editing
        ? `<textarea id="pbody" style="min-height:55vh;font-size:14px">${esc(principles)}</textarea>
           <button class="btn" id="psave" style="width:100%;margin-top:10px">저장</button>
           <div class="hint">원칙은 자유롭게 고치세요. 클라우드에 저장돼 어느 기기서나 보입니다.</div>`
        : `<div class="body" style="font-size:15px;line-height:1.7">${esc(principles)}</div>`}
    </div>`;
    dlg.querySelector('#close').onclick=()=>dlg.close();
    dlg.querySelector('#edit').onclick=()=>{ editing=!editing; draw(); };
    if(editing){
      dlg.querySelector('#psave').onclick=async()=>{
        await savePrinciples(dlg.querySelector('#pbody').value);
        editing=false; draw();
      };
    }
  };
  document.body.appendChild(dlg); draw(); dlg.showModal();
  dlg.addEventListener('close',()=>dlg.remove());
}

// ───────── 로그인 ─────────
function renderLogin(){
  app.innerHTML=`<div class="center"><div class="login">
    <h1>거래일지</h1>
    <p class="hint">이메일로 6자리 코드를 받아 로그인합니다.<br>한 번 로그인하면 어느 기기서나 같은 일지가 보여요.</p>
    <div id="step1">
      <label style="text-align:left">이메일</label>
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
      <button class="btn" id="send" style="width:100%;margin-top:10px">코드 받기</button>
    </div>
    <div id="step2" style="display:none">
      <label style="text-align:left">메일로 온 6자리 코드</label>
      <input type="text" id="code" inputmode="numeric" placeholder="123456" autocomplete="one-time-code">
      <button class="btn" id="verify" style="width:100%;margin-top:10px">로그인</button>
    </div>
    <div class="err" id="lerr"></div>
  </div></div>`;
  const err=t=>document.getElementById('lerr').textContent=t||'';
  document.getElementById('send').onclick=async()=>{
    const email=document.getElementById('email').value.trim(); if(!email){err('이메일을 입력하세요');return;}
    err('보내는 중...');
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error){ err('전송 실패: '+error.message); return; }
    window._email=email; document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block'; err('');
  };
  document.getElementById('verify').onclick=async()=>{
    const token=document.getElementById('code').value.trim();
    err('확인 중...');
    const { data, error } = await sb.auth.verifyOtp({ email:window._email, token, type:'email' });
    if(error){ err('코드가 틀렸어요: '+error.message); return; }
    session=data.session; fetchEntries();
  };
}

// ───────── 시작 ─────────
const { data:{ session:s } } = await sb.auth.getSession();
session = s;
if(session) fetchEntries(); else renderLogin();
sb.auth.onAuthStateChange((_e, ns)=>{ session=ns; });
</script>
</body>
</html>
